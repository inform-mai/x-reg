<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет - x-reg</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/access.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
     <div class="profile-card">
      <h1>Личный кабинет</h1>
      <div class="user-info">
        <p><strong>ФИО:</strong> <span id="user-name"></span></p>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
        <p><strong>Роль:</strong> Сотрудник отдела кадров</p>
        <p><strong>Статус:</strong> <span style="color: green;">Активен</span></p>
      </div>
    </div>
    <div class="profile-card" style="margin-top: 20px;">
      <h2>Безопасность</h2>
      <form id="change-password-form" novalidate>
        <div style="margin-bottom: 15px;">
          <label>Текущий пароль:</label><br>
          <input type="password" id="current-password" placeholder="••••••••">
          <span id="error-current" style="color: red; font-size: 12px; display: none;"></span>
        </div>
        <div style="margin-bottom: 15px;">
          <label>Новый пароль:</label><br>
          <input type="password" id="new-password" placeholder="••••••••">
          <span id="error-new" style="color: red; font-size: 12px; display: none;"></span>
        </div>
        <button type="submit">Изменить пароль</button>
      </form>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
